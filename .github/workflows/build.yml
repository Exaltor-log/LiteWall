name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unduh libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Headers $headers https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "Paket mpv-dev tidak ditemukan" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompvdev -y | Out-Null
          New-Item -ItemType Directory -Force native | Out-Null
          $dll = Get-ChildItem mpvdev -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll tidak ada di paket" }
          Copy-Item $dll.FullName native/libmpv-2.dll

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish LiteWall.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false -o publish
          if (-not (Test-Path publish/libmpv-2.dll)) { throw "libmpv-2.dll tidak ikut ke folder publish" }
          Compress-Archive -Path publish/* -DestinationPath LiteWall-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiteWall-win-x64
          path: LiteWall-win-x64.zip

      - name: Rilis di GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteWall-win-x64.zip
          generate_release_notes: true
